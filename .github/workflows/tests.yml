name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Relay and frame mapping tests
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Windows PowerShell syntax and task argument checks
        if: runner.os == 'Windows'
        shell: powershell
        run: .\.github\test_windows_scripts.ps1
